name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - master
      - main

  push:
    branches:
      - master
      - main
    # Publish pep440 tags as releases.
    tags: [ '*.*.*' ]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Serialize runs per ref so an older run cannot finish last and overwrite a tag
# (e.g. :master) with an older image. PR runs are cancelled when superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    name: Run smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # The image is built here once and its layers are saved to the GitHub Actions cache.
    # The build job below reuses them, so it does not have to build the image again.
    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: prod
        load: true
        tags: nextcloud
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true

    # Mirror the real deployment: the entrypoint expects the config, data and apps_installed
    # folders to exist (they are volumes in docker-compose.yml). The container listens on
    # port 80 (EXPOSE 80), so that is the port that has to be published.
    # The health check interval is shortened so the first check does not wait the default 30s.
    - name: Start container
      run: |
        docker run -d --name nextcloud \
            -p 8000:80 \
            -v /var/www/nextcloud/config \
            -v /var/www/nextcloud/data \
            -v /var/www/nextcloud/apps_installed \
            --health-interval=5s \
            nextcloud

    - name: Wait for healthy container
      run: |
        status="starting"
        for _ in $(seq 1 60); do
          if [ "$(docker inspect -f '{{.State.Running}}' nextcloud)" != "true" ]; then
            status="exited"
            break
          fi
          status="$(docker inspect -f '{{.State.Health.Status}}' nextcloud)"
          if [ "${status}" = "healthy" ]; then
            echo "Container is healthy"
            exit 0
          fi
          if [ "${status}" = "unhealthy" ]; then
            break
          fi
          sleep 2
        done
        echo "Container did not become healthy (status: ${status})"
        exit 1

    # Go through the published port, so a wrong port mapping is caught as well
    - name: Smoke Test
      run: |
        curl -fsS http://localhost:8000/status.php | tee /dev/stderr | jq -e 'has("installed")'

    - name: Show container logs
      if: failure()
      run: docker logs nextcloud

    - name: Cleanup
      if: always()
      run: docker rm -fv nextcloud

  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Convert repository name to lowercase
        id: set-variables
        run: |
          echo "image=${{ env.REGISTRY }}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.set-variables.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}
            type=pep440,pattern={{major}}.{{minor}}
    outputs:
      image: ${{ steps.set-variables.outputs.image }}
      meta-json: ${{ steps.meta.outputs.json }}
      meta-labels: ${{ steps.meta.outputs.labels }}
      meta-version: ${{ steps.meta.outputs.version }}

  build:
    name: Build and push Docker images
    needs:
      - smoke-test
      - prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate build configuration
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          call: check

      # Build and push the Docker image with Buildx (don't tag it yet)
      # The images are pushed by digest (push-by-digest=true)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: prod
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.meta-labels }}
          # Reuse the layers built and cached by the smoke-test job
          cache-from: type=gha

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - name: Sanitize platform string
        id: platform
        env:
          PLATFORM_STRING: ${{ matrix.platform }}
        run: |
          echo "value=${PLATFORM_STRING//\//_}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.platform.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Tag docker images for platforms
    needs:
      - build
      - prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Combine all platform images built above (digests) into one tag, so that each platform can pull e.g. the 'latest' tag.
      - name: Create manifest list and tag
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ needs.prepare.outputs.meta-json }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -r '"-t " + (.tags | join(" -t "))' <<< "${META_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.meta-version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
